<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Nuzka Team List</title>
    <!-- เสิร์ฟที่ /overlay-teams ไม่ใช่ /teams
         /teams เป็นหน้าทะเบียนทีมของคนคุมงานไปแล้ว (Phase 6) -->
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/overlay-teams.css">
</head>
<body data-layout-scene="teams">
    <div class="tl-stage" id="stage">
        <div data-layout="header" class="tl-head" id="head">
            <div data-layout="title" class="tl-title" id="title"></div>
            <div data-layout="subtitle" class="tl-sub" id="subtitle"></div>
        </div>
        <div data-layout-items="team" data-layout="grid" class="tl-grid" id="grid"></div>
        <div data-layout="note" class="tl-note" id="note" hidden></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- overlay-teams.js ประกาศ socket ไว้ ต้องมาก่อน overlay-size.js ที่ไปอ่านตัวนั้น -->
    <script src="/js/lib/overlay-common.js"></script>
    <script src="/js/overlay-teams.js"></script>
    <script src="/js/lib/motion-core.js"></script>

    <script src="/js/lib/overlay-broadcast.js"></script>

    <script src="/js/overlay-bg.js"></script>

    <script src="/js/overlay-size.js"></script>
    <script src="/js/overlay-fonts.js"></script>
    <script src="/js/overlay-style-editor.js"></script>
    <script src="/js/overlay-layout.js"></script>
</body>
</html>
