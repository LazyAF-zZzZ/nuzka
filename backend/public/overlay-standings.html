<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>ROV Standings Overlay</title>
    <!-- กราฟิกออกอากาศ ห้ามลิงก์ธีมของหน้าคนคุมงาน และห้ามโหลดตัวแปลภาษา
         สิ่งที่คนดูเห็นต้องไม่เปลี่ยนตามการตั้งค่าของหน้าคุมงาน -->
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/overlay-standings.css">
</head>
<body data-layout-scene="standings">
    <div class="st-stage" id="stage">
        <div data-layout="header" class="st-head">
            <div data-layout="title" class="st-title" id="title"></div>
            <div data-layout="subtitle" class="st-sub" id="subtitle"></div>
        </div>
        <div data-layout-items="group" data-layout="groups" class="st-groups" id="groups"></div>
        <div data-layout="note" class="st-note" id="note" hidden></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- overlay-standings.js ประกาศ socket ไว้ ต้องมาก่อน overlay-size.js ที่อ่านตัวนั้น -->
    <script src="/js/lib/overlay-common.js"></script>
    <script src="/js/overlay-standings.js"></script>
    <script src="/js/overlay-size.js"></script>
    <script src="/js/overlay-fonts.js"></script>
    <script src="/js/overlay-layout.js"></script>
</body>
</html>
