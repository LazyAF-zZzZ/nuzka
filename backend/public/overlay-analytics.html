<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Nuzka Stats Board</title>
    <!-- เสิร์ฟที่ /overlay-analytics ไม่ใช่ /analytics
         /analytics เป็นหน้าสถิติของคนคุมงานไปแล้ว (Phase 8)

         ไม่โหลดธีมของหน้าคนคุมงาน และไม่โหลดตัวแปลภาษา ตั้งใจทั้งคู่
         นี่คือกราฟิกที่คนดูเห็น หน้าตามาจากหน้า Design และตัวหนังสือเป็นอังกฤษเสมอ
         (เทสต์เช็คด้วยการหาชื่อไฟล์ในหน้า การเอ่ยชื่อไฟล์ตรงนี้จะทำให้เทสต์ตกทันที) -->
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/overlay-analytics.css">
</head>
<body data-layout-scene="analytics">
    <div class="an-stage" id="stage">
        <div data-layout="header" class="an-head" id="head">
            <div class="an-titles">
                <div data-layout="title" class="an-title" id="title"></div>
                <div data-layout="subtitle" class="an-sub" id="subtitle"></div>
            </div>
            <div data-layout="summary" class="an-meta" id="meta"></div>
        </div>

        <div data-layout-items="row" data-layout="board" class="an-board" id="board"></div>
        <div data-layout="note" class="an-note" id="note" hidden></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- overlay-analytics.js ประกาศ socket ไว้ ต้องมาก่อน overlay-size.js ที่ไปอ่านตัวนั้น -->
    <script src="/js/lib/hero-art.js"></script>
    <script src="/js/lib/overlay-common.js"></script>
    <script src="/js/overlay-analytics.js"></script>
    <script src="/js/lib/motion-core.js"></script>
    <script src="/js/lib/overlay-broadcast.js"></script>
    <script src="/js/overlay-bg.js"></script>
    <script src="/js/overlay-size.js"></script>
    <script src="/js/overlay-fonts.js"></script>
    <script src="/js/overlay-style-editor.js"></script>
    <script src="/js/overlay-layout.js"></script>
</body>
</html>
